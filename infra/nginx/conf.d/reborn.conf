# Reborn edge proxy. Terminates TLS and proxies to web + api.
# For local/dev without certs, comment out the 443 block and use the 80 server directly.

limit_req_zone $binary_remote_addr zone=submit:10m rate=10r/m;

upstream web_upstream { server web:3000; }
upstream api_upstream { server api:4000; }

server {
    listen 80;
    server_name _;
    # Redirect to HTTPS in production; keep 80 serving for local dev / ACME challenges.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rate-limit code submissions to prevent spam.
    location = /api/submit {
        limit_req zone=submit burst=5 nodelay;
        proxy_pass http://api_upstream/submit;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/ {
        proxy_pass http://api_upstream/;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location / {
        proxy_pass http://web_upstream;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
