# Judge0 1.13.1 configuration. Mounted at /judge0.conf in the server + workers containers.

# --- datastore (Judge0's OWN postgres + redis, not the app's) ---
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

REDIS_HOST=judge0-redis
REDIS_PORT=6379

# --- security: untrusted code must never reach the network ---
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# --- default sandbox limits (the grader also sends per-submission overrides) ---
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=256000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=4096

# --- do not expose extra surface ---
MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_FOR_COMPILE_OPTIONS=
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=50
ENABLE_SUBMISSION_DELETE=false
