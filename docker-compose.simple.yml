# Simplified stack for Render/Railway/Fly (no Judge0).
# Just Postgres, Node API, Next.js web, and Nginx reverse proxy.
# This is also useful for local development without the sandbox complexity.

name: reborn-simple

x-restart: &restart
  restart: unless-stopped

services:
  # Application database
  postgres:
    image: postgres:16-alpine
    <<: *restart
    ports:
      - "5544:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  # Node API (no grader calls)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: *restart
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      API_PORT: 4000
      # GRADER_URL is unset (not used in simple mode)
    depends_on:
      postgres:
        condition: service_healthy
    networks: [appnet]

  # Next.js web frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    <<: *restart
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    networks: [appnet]

  # Nginx reverse proxy (optional for local dev; Render/Railway don't need it)
  nginx:
    image: nginx:1.27-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on: [web, api]
    networks: [appnet]

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
