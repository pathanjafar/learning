services:
  - type: web
    name: reborn-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reborn-postgres
          property: connectionString
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production

  - type: web
    name: reborn-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: reborn-api
          property: publicUrl
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production

databases:
  - name: reborn-postgres
    plan: free
    region: oregon
    databaseName: reborn
    user: reborn
    ipAllowList: []
