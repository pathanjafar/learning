name: Deploy to VPS

# Deploys on every push to main by SSHing into the VPS, pulling the latest code,
# and rebuilding the Docker stack. Configure the repo Secrets listed below first.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST       e.g. 203.0.113.10
#   VPS_USER       e.g. deploy
#   VPS_SSH_KEY    the PRIVATE key whose public half is in the VPS's ~/.ssh/authorized_keys
#   VPS_PORT       (optional) SSH port, defaults to 22
#
# Assumes the repo is already cloned on the VPS at /opt/reborn with a configured .env
# (see DEPLOYMENT.md for the one-time server setup).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/reborn
            git pull origin main
            docker compose -f infra/docker-compose.yml up -d --build
            # apply any new DB migrations (api image bundles the Prisma schema + CLI)
            docker compose -f infra/docker-compose.yml exec -T api \
              npx prisma migrate deploy --schema packages/db/prisma/schema.prisma || true
            docker image prune -f
